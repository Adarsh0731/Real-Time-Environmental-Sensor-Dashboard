<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Sync Platform Prototype</title>
    <style>
        /* TARGETED UI REFINEMENTS: Responsive Architecture */
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .platform-container {
            width: 100%;
            /* Consistent interaction patterns across hardware specifications */
            max-width: 800px; 
            background: var(--card);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 2rem;
        }

        /* Desktop view refinement */
        @media (min-width: 768px) {
            .header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            background: #f1f5f9;
        }

        .dot {
            height: 8px;
            width: 8px;
            background: #10b981;
            border-radius: 50%;
        }

        .syncing .dot {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .info-footer {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #64748b;
            border-top: 1px solid #f1f5f9;
            padding-top: 1rem;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="platform-container">
        <div class="header">
            <div>
                <h2 style="margin:0">Cloud Workspace</h2>
                <p style="margin:4px 0; color:#64748b; font-size:0.9rem">Cross-device architectural refinement</p>
            </div>
            <div id="syncStatus" class="status-badge">
                <div class="dot"></div>
                <span id="statusText">System Parity Established</span>
            </div>
        </div>

        <textarea id="workArea" placeholder="Begin typing to sync across local caches..."></textarea>

        <div class="info-footer">
            <strong>Audit Note:</strong> Optimized for frictionless mobile-to-desktop hand-off. 
            Open this page in two separate windows to see <strong>Real-Time Parity</strong>.
        </div>
    </div>

    <script>
        const workArea = document.getElementById('workArea');
        const syncStatus = document.getElementById('syncStatus');
        const statusText = document.getElementById('statusText');

        // 1. DATA RECONCILIATION: Load from local cache on startup
        window.onload = () => {
            const savedData = localStorage.getItem('platform_state');
            if (savedData) {
                workArea.value = savedData;
            }
        };

        // 2. OPTIMIZING STATE-MANAGEMENT: Listen for changes (Input)
        workArea.addEventListener('input', (e) => {
            const value = e.target.value;
            
            // Visual feedback for "Performance Sweep" / Latency
            syncStatus.classList.add('syncing');
            statusText.innerText = "Reconciling Remote...";

            // Update Local Cache
            localStorage.setItem('platform_state', value);

            // Simulate server round-trip latency resolution
            setTimeout(() => {
                syncStatus.classList.remove('syncing');
                statusText.innerText = "System Parity Established";
            }, 500);
        });

        // 3. SEAMLESS HAND-OFF: Listen for updates from other "devices" (tabs)
        window.addEventListener('storage', (event) => {
            if (event.key === 'platform_state') {
                workArea.value = event.newValue;
                
                // Indicate real-time reconciliation
                syncStatus.classList.add('syncing');
                statusText.innerText = "Syncing from remote...";
                
                setTimeout(() => {
                    syncStatus.classList.remove('syncing');
                    statusText.innerText = "System Parity Established";
                }, 500);
            }
        });
    </script>
</body>
</html>
